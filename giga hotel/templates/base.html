<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GigaHotel</title>
    <link rel="shortcut icon" type="image/jpeg" href="{{ url_for('static', filename='image/favicon.jpg', v='2') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-container">

    <aside class="sidebar">
        <div>
            <div class="brand">
                <div class="brand-icon">G</div>
                <span>GigaHotel</span>
            </div>
            <nav class="menu">
                <div class="menu-section">Main</div>
                <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>

                <div class="menu-section">Management</div>
                <a href="{{ url_for('rooms') }}" class="nav-item {% if request.endpoint == 'rooms' %}active{% endif %}">Rooms</a>
                <a href="{{ url_for('guests') }}" class="nav-item {% if request.endpoint == 'guests' %}active{% endif %}">Guests</a>
                <a href="{{ url_for('foods') }}" class="nav-item {% if request.endpoint == 'foods' %}active{% endif %}">Food & Dining</a>
                <a href="{{ url_for('events') }}" class="nav-item {% if request.endpoint == 'events' %}active{% endif %}">Events</a>
                <a href="{{ url_for('bookings') }}" class="nav-item {% if request.endpoint == 'bookings' %}active{% endif %}">Bookings</a>

                <div class="menu-section">Analytics</div>
                <a href="{{ url_for('reports') }}" class="nav-item {% if request.endpoint == 'reports' %}active{% endif %}">Reports</a>
            </nav>
        </div>

        <div class="user-profile">
            <div class="profile-info">
                <h4>{{ session.get('user', 'Admin') }}</h4>
                <p>System Administrator</p>
            </div>
            <a href="{{ url_for('logout') }}" class="logout-btn">Sign Out</a>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
