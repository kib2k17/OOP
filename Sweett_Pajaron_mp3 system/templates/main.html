<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Library</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0e15 !important;
      color: #ffffff !important;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      height: 90vh;
      background-color: #141622;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      border: 1px solid #232738;
    }

    .app-header {
      padding: 20px;
      background-color: #1a1d2e;
      border-bottom: 1px solid #232738;
    }

    .app-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00f2fe;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .welcome-text {
      color: #94a3b8;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .logout-link {
      color: #94a3b8;
      font-size: 0.8rem;
      text-decoration: none;
      white-space: nowrap;
    }

    .logout-link:hover {
      color: #ffffff;
    }

    /* Genre Tabs */
    .genre-tabs {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background-color: #141622;
      overflow-x: auto;
      border-bottom: 1px solid #232738;
    }

    .genre-tab {
      background: #1a1d2e;
      border: 1px solid #232738;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .genre-tab.active {
      background: linear-gradient(135deg, #7928ca 0%, #4c1d95 100%);
      color: #ffffff;
      border-color: #7928ca;
    }

    .genre-tab:hover:not(.active) {
      background-color: #232738;
      color: #fff;
    }

    /* Song List Container */
    .song-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px;
    }

    /* Custom Scrollbar */
    .song-list-container::-webkit-scrollbar {
      width: 6px;
    }
    .song-list-container::-webkit-scrollbar-thumb {
      background: #232738;
      border-radius: 4px;
    }

    .song-list {
      list-style: none !important;
      padding: 0 !important;
      margin: 0 !important;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .song-item:hover {
      background-color: #1a1d2e;
    }

    .song-item.playing {
      background-color: #202538;
      border-left: 4px solid #00f2fe;
    }

    .song-cover {
      width: 50px !important;
      height: 50px !important;
      border-radius: 6px;
      object-fit: cover;
      background-color: #232738;
      flex-shrink: 0;
    }

    .song-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .song-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-meta {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .no-songs {
      text-align: center;
      color: #94a3b8;
      margin-top: 40px;
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }

    /* Mini Player Footer */
    .mini-player {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 20px;
      background-color: #1a1d2e;
      border-top: 1px solid #232738;
    }

    .player-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-info {
      min-width: 0;
      padding-right: 12px;
    }

    .track-details h4 {
      font-size: 0.9rem;
      color: #fff;
      margin-bottom: 2px;
    }

    .track-details p {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .control-btn {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: #000;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .control-btn:hover {
      transform: scale(1.05);
    }

    .seeker-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-text {
      min-width: 34px;
      color: #94a3b8;
      font-family: monospace;
      font-size: 0.72rem;
      text-align: center;
    }

    .seeker-slider {
      flex: 1;
      height: 5px;
      accent-color: #00f2fe;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="header-row">
        <h1><i class="fa-solid fa-compact-disc"></i> Music Library</h1>
        <a class="logout-link" href="{{ url_for('logout') }}">Log out</a>
      </div>
      <p class="welcome-text">Welcome, {{ session['username'] }}!</p>
    </header>

    <nav class="genre-tabs" id="genreTabs">
      <button class="genre-tab active" data-genre="All">All</button>
      <button class="genre-tab" data-genre="Rock">Rock</button>
      <button class="genre-tab" data-genre="Love Songs">Love Songs</button>
      <button class="genre-tab" data-genre="Country">Country</button>
    </nav>

    <main class="song-list-container">
      <ul class="song-list" id="songList"></ul>
      <div id="noSongsMessage" class="no-songs hidden">No songs found in this genre.</div>
    </main>

    <footer class="mini-player" id="miniPlayer">
      <div class="player-header">
        <div class="player-info track-details">
          <h4 id="playerTitle">Select a track</h4>
          <p id="playerArtist">Click any song to play</p>
        </div>
        <button id="playBtn" class="control-btn" aria-label="Play or pause track">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </button>
      </div>

      <div class="seeker-container">
        <span id="currentTime" class="time-text">0:00</span>
        <input type="range" id="seeker" class="seeker-slider" value="0" min="0" max="0" step="0.1" aria-label="Track progress">
        <span id="durationTime" class="time-text">0:00</span>
      </div>

      <audio id="audioPlayer" preload="metadata"></audio>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
