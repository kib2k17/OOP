<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GigaHotel - Login</title>
    <link rel="shortcut icon" type="image/jpeg" href="{{ url_for('static', filename='image/favicon.jpg', v=2) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .password-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        .password-wrapper input {
            border-radius: 20px;
            padding-right: 45px;
            margin-bottom: 0;
        }
        .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555555;
            padding: 0;
        }
        .toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>GigaHotel Access</h2>
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <p style="color: red; font-size: 0.85rem; margin-bottom: 12px;">{{ messages[0] }}</p>
              {% endif %}
            {% endwith %}
            <form action="{{ url_for('login') }}" method="POST">
                <input type="text" name="username" class="form-control" placeholder="Username (admin)" style="border-radius: 20px; margin-bottom: 16px;" required>
                
                <div class="password-wrapper">
                    <input type="password" id="passwordInput" name="password" class="form-control" placeholder="Password (admin123)" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword()">
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M2 10s3.5 4 10 4 10-4 10-4"/>
                            <path d="M4 11l-1.5 2.5"/>
                            <path d="M8.5 13.5L7.5 16.5"/>
                            <path d="M12 14v3"/>
                            <path d="M15.5 13.5l1 3"/>
                            <path d="M20 11l1.5 2.5"/>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="btn" style="width: 100%; border-radius: 20px;">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                    <path d="M3 8l-1.5-2"/>
                    <path d="M7 5L6 2.5"/>
                    <path d="M12 4V1"/>
                    <path d="M17 5l1-2.5"/>
                    <path d="M21 8l1.5-2"/>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M2 10s3.5 4 10 4 10-4 10-4"/>
                    <path d="M4 11l-1.5 2.5"/>
                    <path d="M8.5 13.5L7.5 16.5"/>
                    <path d="M12 14v3"/>
                    <path d="M15.5 13.5l1 3"/>
                    <path d="M20 11l1.5 2.5"/>
                `;
            }
        }
    </script>
</body>
</html>
