{% extends 'base.html' %}
{% block content %}
<h2>System Reports</h2>
<br>

<div class="report-card">
    <h3>Occupancy Summary</h3>
    <p>Current Occupancy Rate: <strong>{{ occupancy_rate }}%</strong> ({{ occupied }} of {{ total_rooms }} rooms occupied)</p>
</div>

<div class="report-card">
    <h3>Key Metrics</h3>
    <table class="data-table mt-16">
        <thead>
            <tr>
                <th>Metric</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody>
            {% for item in metrics %}
            <tr>
                <td>{{ item.metric }}</td>
                <td><strong>{{ item.value }}</strong></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
