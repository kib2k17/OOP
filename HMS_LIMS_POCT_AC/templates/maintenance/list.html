{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h2>Maintenance</h2><a class="btn btn-primary" href="{% url 'maintenance-create' %}">Add Maintenance</a></div><table class="table mt-3"><tr><th>Device</th><th>Type</th><th>Performed</th><th>Next Due</th><th>Status</th></tr>{% for m in records %}<tr><td>{{ m.device }}</td><td>{{ m.maintenance_type }}</td><td>{{ m.performed_date }}</td><td>{{ m.next_maintenance_date }}</td><td>{{ m.status }}</td></tr>{% endfor %}</table>{% endblock %}
