{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h2>Quality Control</h2><a class="btn btn-primary" href="{% url 'qc-create' %}">Enter QC</a></div><table class="table mt-3"><tr><th>Date</th><th>Device</th><th>Test</th><th>Level</th><th>Result</th><th>Status</th><th>Corrective Action</th></tr>{% for q in records %}<tr><td>{{ q.performed_at }}</td><td>{{ q.device }}</td><td>{{ q.test_method }}</td><td>{{ q.control_level }}</td><td>{{ q.result }}</td><td><span class="badge {% if q.status == 'PASS' %}text-bg-success{% else %}text-bg-danger{% endif %}">{{ q.status }}</span></td><td>{{ q.corrective_action }}</td></tr>{% endfor %}</table>{% endblock %}
