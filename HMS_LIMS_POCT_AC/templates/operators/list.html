{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h2>Operators</h2><a class="btn btn-primary" href="{% url 'operator-create' %}">Add Operator</a></div><form class="my-3"><input class="form-control" name="q" value="{{ q }}" placeholder="Search employee ID or name"></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Employee ID</th><th>Name</th><th>Department</th><th>Status</th><th></th></tr></thead><tbody>{% for o in operators %}<tr><td>{{ o.employee_id }}</td><td>{{ o.full_name }}</td><td>{{ o.department }}</td><td>{% if o.active %}<span class="badge text-bg-success">Active</span>{% else %}<span class="badge text-bg-secondary">Inactive</span>{% endif %}</td><td><a class="btn btn-sm btn-outline-primary" href="{% url 'operator-detail' o.pk %}">View</a></td></tr>{% empty %}<tr><td colspan="5">No operators found.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
