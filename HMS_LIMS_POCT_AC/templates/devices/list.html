{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h2>Devices</h2><a class="btn btn-primary" href="{% url 'device-create' %}">Add Device</a></div><table class="table table-hover mt-3"><tr><th>ID</th><th>Type</th><th>Manufacturer / Model</th><th>Location</th><th>Status</th></tr>{% for d in devices %}<tr><td>{{ d.device_id }}</td><td>{{ d.device_type }}</td><td>{{ d.manufacturer }} {{ d.model }}</td><td>{{ d.location }}</td><td>{{ d.get_status_display }}</td></tr>{% endfor %}</table>{% endblock %}
