{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h2>Competency</h2><a class="btn btn-primary" href="{% url 'competency-create' %}">Record Competency</a></div><table class="table table-hover mt-3"><tr><th>Operator</th><th>Test</th><th>Assessor</th><th>Completion</th><th>Expiration</th><th>Status</th></tr>{% for c in competencies %}<tr><td>{{ c.operator }}</td><td>{{ c.test_method }}</td><td>{{ c.assessor }}</td><td>{{ c.completion_date }}</td><td>{{ c.expiration_date }}</td><td><span class="badge {% if c.status == 'CURRENT' %}text-bg-success{% elif c.status == 'DUE SOON' %}text-bg-warning{% else %}text-bg-danger{% endif %}">{{ c.status }}</span></td></tr>{% endfor %}</table>{% endblock %}
