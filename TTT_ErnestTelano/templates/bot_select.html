```html
<!DOCTYPE html>
<html>
<head>
    <title>Choose Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <ul>
        <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li><a href="{{ url_for('leaderboard') }}">Leaderboard</a></li>
        <li><a href="{{ url_for('logout') }}">Logout</a></li>
    </ul>
</nav>


<div class="container">

    <h1>Choose Difficulty</h1>

    <p class="subtitle">
        Select the bot difficulty you want to play.
    </p>


    <div class="difficulty-grid">

        <div class="difficulty-card">

            <h2>Easy</h2>

            <p>
                The bot makes random moves.
            </p>

            <a href="{{ url_for('start_bot_game', difficulty='easy') }}">

                <button>
                    Play Easy
                </button>

            </a>

        </div>


        <div class="difficulty-card">

            <h2>Medium</h2>

            <p>
                The bot can win and block moves.
            </p>

            <a href="{{ url_for('start_bot_game', difficulty='medium') }}">

                <button>
                    Play Medium
                </button>

            </a>

        </div>


        <div class="difficulty-card">

            <h2>Hard</h2>

            <p>
                The bot uses a stronger strategy.
            </p>

            <a href="{{ url_for('start_bot_game', difficulty='hard') }}">

                <button>
                    Play Hard
                </button>

            </a>

        </div>

    </div>


    <a class="back-link"
       href="{{ url_for('dashboard') }}">

        ← Back to Dashboard

    </a>

</div>

</body>
</html>
