
<!DOCTYPE html>
<html>
<head>
    <title>Matchmaking - Tic Tac Toe</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <ul>
        <li>
            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>
        </li>

        <li>
            <a href="{{ url_for('leaderboard') }}">
                Leaderboard
            </a>
        </li>

        <li>
            <a href="{{ url_for('logout') }}">
                Logout
            </a>
        </li>
    </ul>
</nav>


<div class="container matchmaking-container">

    <h1>Multiplayer</h1>

    <p class="matchmaking-text">
        Find another player and play Tic Tac Toe.
    </p>


    <div class="match-card">

        <h2>Quick Match</h2>

        <p>
            Click the button below to find another player.
            If someone is already waiting, you will join
            their game automatically.
        </p>


        <form action="{{ url_for('find_match') }}"
              method="POST">

            <button type="submit"
                    class="match-button">

                Find Match

            </button>

        </form>

    </div>



    <a class="back-link"
       href="{{ url_for('dashboard') }}">

        ← Back to Dashboard

    </a>

</div>

</body>
</html>
