
<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <ul>
        <li><a href="{{ url_for('login') }}">Login</a></li>
        <li><a href="{{ url_for('register') }}">Register</a></li>
    </ul>
</nav>


<div class="container">

    <h1>Tic Tac Toe</h1>

    <p class="subtitle">
        Play against other players or challenge the bot.
    </p>


    <div class="difficulty-grid">

        <div class="difficulty-card">

            <h2>Multiplayer</h2>

            <p>
                Find another player and play online.
            </p>

            <a href="{{ url_for('matchmaking') }}">

                <button>
                    Play Game
                </button>

            </a>

        </div>


        <div class="difficulty-card">

            <h2>Play Bot</h2>

            <p>
                Choose a difficulty and challenge the computer.
            </p>

            <a href="{{ url_for('bot') }}">

                <button>
                    Play Bot
                </button>

            </a>

        </div>


        <div class="difficulty-card">

            <h2>Leaderboard</h2>

            <p>
                Check the rankings of all players.
            </p>

            <a href="{{ url_for('leaderboard') }}">

                <button>
                    View Rankings
                </button>

            </a>

        </div>

    </div>

</div>

</body>
</html>
