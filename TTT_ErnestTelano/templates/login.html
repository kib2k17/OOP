
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <ul>
        <li><a href="{{ url_for('login') }}">Login</a></li>
        <li><a href="{{ url_for('register') }}">Register</a></li>
    </ul>
</nav>


<div class="container" style="max-width: 500px;">

    <h1>Tic Tac Toe</h1>

    <p class="subtitle">
        Login to continue playing.
    </p>


    {% if error %}

        <p class="message">
            {{ error }}
        </p>

    {% endif %}


    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >


        <button
            type="submit"
            style="width: 100%;"
        >
            Login
        </button>

    </form>


    <p class="subtitle">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create one
        </a>

    </p>

</div>

</body>
</html>
